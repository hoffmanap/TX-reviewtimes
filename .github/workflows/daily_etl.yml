name: Texas Permit ETL Ingestion

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m src.etl_pipeline

      - name: Commit and Push Updated Data Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of permit summary data"
          file_pattern: "data/texas_permit_summary.csv data/texas_permit_detailed.csv"
