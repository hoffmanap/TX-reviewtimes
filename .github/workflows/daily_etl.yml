name: Texas Permit ETL Ingestion

on:
  schedule:
    # Executes every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual pipeline triggering from GitHub Actions UI

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m src.etl_pipeline

      - name: Commit and Push Updated Data Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/texas_permit_summary.csv data/texas_permit_detailed.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of permit summary data" && git push)
